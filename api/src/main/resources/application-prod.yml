spring:
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${AUTH0_ISSUER_URI}
  docker:
    compose:
      enabled: false

ricash:
  security:
    jwt:
      principal-claim-name: preferred_username
      audience: ${AUTH0_AUDIENCE}
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS}

logging:
  structured:
    format:
      # One JSON object per line (Elastic Common Schema) for the log pipeline.
      console: ecs
