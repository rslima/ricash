management:
  endpoints:
    web:
      exposure:
        include: health

spring:
  flyway:
    enabled: on

  http:
    clients:
      connect-timeout: 5s
      read-timeout: 10s

  jdbc:
    template:
      # Backstop for runaway queries (e.g. a recursive CTE gone wrong): the
      # driver cancels any statement issued through JdbcClient after 30s.
      query-timeout: 30s

  datasource:
    url: jdbc:postgresql://localhost:5432/ricash
    username: ricash
    password: secret
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:9180/realms/Ricash
ricash:
  security:
    jwt:
      principal-claim-name: preferred_username
      audience: ""
    cors:
      allowed-origins: http://localhost:5173,http://localhost:3000
  instrument-prices:
    api-token: ${EODHD_API_TOKEN:}
