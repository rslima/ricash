management:
  endpoints:
    web:
      exposure:
        include: health

spring:
  flyway:
    enabled: on

  # Local runs get the datasource from the docker-compose service connection
  # (compose.yaml); deployments must supply SPRING_DATASOURCE_URL/USERNAME/
  # PASSWORD via the environment.
  datasource:
    url: jdbc:postgresql://localhost:5432/ricash
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:9180/realms/Ricash
  mvc:
    problemdetails:
      enabled: off

ricash:
  security:
    jwt:
      principal-claim-name: preferred_username
      authorities-claim-name: realm_access/roles
      authority-prefix: ""
      audience: ""
    cors:
      allowed-origins: http://localhost:5173,http://localhost:3000
