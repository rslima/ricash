management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      # /actuator/health/liveness and /readiness. Liveness ignores the
      # database, so a platform health check pointed at it restarts the app
      # only when the app itself is broken, not during a DB outage.
      probes:
        enabled: true

spring:
  # Java 25: request handling and @Scheduled tasks run on virtual threads;
  # blocking JDBC and RestClient calls no longer tie up platform threads.
  threads:
    virtual:
      enabled: true

  flyway:
    enabled: on

  http:
    clients:
      connect-timeout: 5s
      read-timeout: 10s

  datasource:
    url: jdbc:postgresql://localhost:5432/ricash
    username: ricash
    password: secret
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:9180/realms/Ricash
ricash:
  security:
    jwt:
      principal-claim-name: preferred_username
      authorities-claim-name: realm_access/roles
      authority-prefix: ""
      audience: ""
    cors:
      allowed-origins: http://localhost:5173,http://localhost:3000
  instrument-prices:
    api-token: ${EODHD_API_TOKEN:}
